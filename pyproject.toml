[project]
name = "volrisk"
version = "0.1.0"
description = "Volatility forecasting and risk analytics engine: daily OHLCV ingestion, next-day volatility forecasts (EWMA, GARCH, HAR-RV, LightGBM), and 1-day VaR with coverage backtesting."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Aakrisht Yadav" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    "arch>=8.0.0",
    "lightgbm>=4.6.0",
    "pandas>=3.0.3",
    "pandas-market-calendars>=5.4.0",
    "pandera>=0.32.1",
    "psycopg[binary]>=3.3.4",
    "pyarrow>=24.0.0",
    "pydantic-settings>=2.14.2",
    "requests>=2.34.2",
    "scikit-learn>=1.9.0",
    "sqlalchemy>=2.0.51",
    "yfinance>=1.5.1",
]

[project.optional-dependencies]
# Experiment tracking is deliberately OPTIONAL: the pipeline must run, and the
# nightly job must succeed, without it. Install with `uv sync --extra tracking`.
#
# mlflow-skinny, not mlflow: the full server package pins pandas<3 and would
# force this project off pandas 3 (the standing pandas<3 tripwire). The skinny
# client carries no such pin, writes the same local file store, and is all the
# logging path needs. The UI is launched from an isolated tool environment
# (`uvx mlflow ui`), so the server's pins never touch this project.
tracking = ["mlflow-skinny>=3.0", "alembic>=1.13"]

[project.urls]
Repository = "https://github.com/aakrisht-26/volatility-risk-engine"
Issues = "https://github.com/aakrisht-26/volatility-risk-engine/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/volrisk"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort (import sorting)
    "B",   # flake8-bugbear (likely bugs)
    "UP",  # pyupgrade (modern syntax)
    "SIM", # flake8-simplify
    "RUF", # ruff-specific rules
]

[tool.ruff.lint.isort]
known-first-party = ["volrisk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[dependency-groups]
dev = [
    "pre-commit>=4.6.0",
    "pytest>=9.1.1",
    "ruff>=0.15.20",
]
